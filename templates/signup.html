{% extends 'base.html' %}
{% block title %}Create Account - Floral Recipe App{% endblock %}

{% block content %}
<section class="auth-card">
    <h1>Create your florist workspace</h1>
    <p>Set up your account, then choose a subscription to unlock your workspace.</p>
    <form method="POST" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="workspace_name">Business name</label>
        <input id="workspace_name" name="workspace_name" type="text" autocomplete="organization" required>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">Password (at least 12 characters)</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required>
        <button type="submit">Create account</button>
    </form>
    <p>Already registered? <a href="{{ url_for('auth.login') }}">Log in</a>.</p>
</section>
{% endblock %}
